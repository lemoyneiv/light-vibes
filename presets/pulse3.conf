# Three bold primary bands + blackout beat flash: bass red #22, midrange blue #0, treble teal #50
# Auto-adapting band balance lets whichever register surges win, while kicks & snares strobe 0 -> 10 for 80 ms.
mode=spectrum
bands=40-250:22:1.8 250-3500:0:1.4 3500-16000:50:14
spectrum_dynamic=1
switch_margin=10
band_smoothing_ms=0
min_interval_ms=30
flash_on_beat=1
flash_ms=80
beat_low_hz=40
beat_high_hz=200
sensitivity=140
beat_avg_ms=1400
min_beat_ms=160
brightness_min=0
brightness_max=10
loudness_range_db=6
brightness_curve=range
