# High-impact beat strobe: full blackout between hits, tempo-synced full-lumen flash to 10, vivid jewel-tone leaps
mode=beat
auto_bpm=1
beat_low_hz=40
beat_high_hz=220
sensitivity=135
beat_avg_ms=1200
min_beat_ms=150
flash_on_beat=1
flash_ms=120
beat_step=23
brightness_min=0
brightness_max=10
loudness_range_db=4
min_interval_ms=25
