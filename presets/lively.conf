# Vibrant auto-adapting 5-band spectrum with tempo-synced beat flash and rich jewel hues on both Kia & Hyundai
# bass -> crimson, low-mids -> fiery red-orange, mids -> neon emerald-aqua, highs -> electric cyan, air -> vivid violet
mode=spectrum
bands=40-130:#FF0020:1.6 130-450:#FF3C0F:2.0 450-2000:#00FAC3:3.2 2000-6000:#00AAFF:9 6000-16000:#9100FF:32
spectrum_dynamic=1
auto_bpm=1
switch_margin=12
band_smoothing_ms=10
min_interval_ms=40
flash_on_beat=1
flash_ms=125
beat_low_hz=40
beat_high_hz=180
sensitivity=145
beat_avg_ms=1500
min_beat_ms=180
brightness_min=1
brightness_max=10
loudness_range_db=5
brightness_curve=range
