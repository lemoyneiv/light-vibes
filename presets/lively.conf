# Vibrant auto-adapting 5-band spectrum with crisp 90 ms beat flash
# bass -> red #22, low-mids -> gold #30, mids -> green/aqua #42, highs -> cyan/indigo #56, air -> violet/magenta #8
mode=spectrum
bands=40-130:22:1.6 130-450:30:2.0 450-2000:42:3.2 2000-6000:56:9 6000-16000:8:32
spectrum_dynamic=1
switch_margin=12
band_smoothing_ms=10
min_interval_ms=40
flash_on_beat=1
flash_ms=90
beat_low_hz=40
beat_high_hz=180
sensitivity=145
beat_avg_ms=1500
min_beat_ms=180
brightness_min=1
brightness_max=10
loudness_range_db=5
brightness_curve=range
