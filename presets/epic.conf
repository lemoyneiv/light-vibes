# Cinematic / big-drum music: wide colour leaps and punchy 95 ms flashes on drum impacts, dark 1 floor in between.
mode=beat
beat_low_hz=40
beat_high_hz=160
sensitivity=150
beat_avg_ms=1500
min_beat_ms=200
flash_on_beat=1
flash_ms=95
beat_step=19
brightness_min=1
brightness_max=10
loudness_range_db=5
min_interval_ms=40
