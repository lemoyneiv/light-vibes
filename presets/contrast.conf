# High-contrast 5-band spectrum with zero smoothing, rich dual-die jewel colours, and wide S-curve loudness swing
# bass -> crimson, body -> electric magenta, voice/guitar -> vivid green, presence -> royal blue, air -> vivid violet
mode=spectrum
bands=40-120:#FF0020:1.9 120-500:#FF00B4:2.2 500-2000:#00FF40:3 2000-6000:#141EFF:9 6000-16000:#9100FF:40
spectrum_dynamic=1
auto_bpm=1
switch_margin=10
band_smoothing_ms=0
min_interval_ms=35
flash_on_beat=0
brightness_min=1
brightness_max=10
loudness_range_db=4
brightness_curve=range
