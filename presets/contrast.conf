# High-contrast 5-band spectrum with zero smoothing and wide S-curve loudness swing
# bass -> red #22, body -> amber #28, voice/guitar -> green #44, presence -> cyan #54, air -> violet #8
mode=spectrum
bands=40-120:22:1.9 120-500:28:2.2 500-2000:44:3 2000-6000:54:9 6000-16000:8:40
spectrum_dynamic=1
switch_margin=10
band_smoothing_ms=0
min_interval_ms=35
flash_on_beat=0
brightness_min=1
brightness_max=10
loudness_range_db=4
brightness_curve=range
